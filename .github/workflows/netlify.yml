# Déploie le site sur Netlify (projet « guardess ») à chaque push.
# Prérequis : un secret de dépôt NETLIFY_AUTH_TOKEN (jeton personnel Netlify).
# Sans ce secret, le job est ignoré au lieu d'échouer.
name: Deploy to Netlify

on:
  push:
    branches: [main, claude/guardess-watch-site-06gvnr]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 000599dd-e6b3-4bc2-bb48-784b7a24696d
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::Secret NETLIFY_AUTH_TOKEN absent : déploiement ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Assemble the site
        if: steps.token.outputs.ok == 'true'
        run: |
          mkdir _site
          cp -r index.html preview.html assets _site/

      - name: Deploy (production)
        if: steps.token.outputs.ok == 'true'
        run: npx -y netlify-cli deploy --no-build --dir=_site --prod --site "$NETLIFY_SITE_ID" --message "GitHub ${GITHUB_SHA::7}"
