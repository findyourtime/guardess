# Site statique : aucune commande de build, on publie la racine.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS/JS : toujours revalidés (le CDN Netlify répond 304 si rien n'a changé).
# Les liens portent en plus ?v=<commit>, remplacé au déploiement.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# La planche de validation n'a pas à être indexée
[[headers]]
  for = "/preview.html"
  [headers.values]
    X-Robots-Tag = "noindex"
